<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tandem UI variants</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#8f8f8f;color:#111;padding:20px}
.switch{display:flex;margin-bottom:18px;border:1px solid #111;width:max-content;background:#fff}
.switch button{font:13px Arial;padding:8px 16px;border:0;border-right:1px solid #111;background:#fff;cursor:pointer}
.switch button:last-child{border-right:0}
.switch button.on{background:#111;color:#fff}
.variant{display:none}
.variant.on{display:block}
.stage{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.win{width:900px;height:580px;position:relative;overflow:hidden;flex:none}
.note{font-size:12px;color:#111;background:#fff;padding:8px 12px;border:1px solid #111;max-width:900px;line-height:1.5}
svg{display:block;flex:none}
button{font-family:inherit}

/* A. Braun */
.braun{background:#E8E6E1;color:#1A1A1A;border:1px solid #B5B1A8;display:flex;flex-direction:column}
.braun .tb{height:42px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #CFCBC3;flex:none}
.braun .tb b{font-size:13px;letter-spacing:.4px}
.braun .tb .sub{font-size:11px;color:#7A766E;margin-left:14px}
.braun .wc{margin-left:auto;display:flex;gap:16px}
.braun .main{flex:1;display:grid;grid-template-columns:272px 1fr;min-height:0}
.braun .side{border-right:1px solid #CFCBC3;padding:20px 0 16px;display:flex;flex-direction:column}
.braun .lab{font-size:10px;letter-spacing:1.6px;color:#8A867E;padding:0 20px 8px;text-transform:uppercase}
.braun .lab0{font-size:10px;letter-spacing:1.6px;color:#8A867E;text-transform:uppercase}
.braun .f{display:flex;gap:12px;padding:10px 20px;align-items:center}
.braun .f.sel{background:#F5F4F0}
.braun .dot{width:10px;height:10px;border-radius:50%;flex:none}
.braun .dot.ring{border:1.5px solid #8A867E}
.braun .n{font-size:14px}
.braun .p{font-size:11px;color:#7A766E;margin-top:3px}
.braun .f .s{margin-left:auto;font-size:12px;color:#7A766E}
.braun .btn{font-size:12px;padding:8px 14px;border:1px solid #1A1A1A;background:transparent;color:#1A1A1A;display:inline-flex;gap:8px;align-items:center;border-radius:2px}
.braun .btn.pri{background:#E0601E;border-color:#E0601E;color:#fff}
.braun .btn.sm{padding:5px 10px;font-size:11px}
.braun .detail{padding:26px 32px;min-width:0}
.braun .dh{display:flex;align-items:flex-start}
.braun .title{font-size:30px;letter-spacing:-.5px}
.braun .acts{margin-left:auto;display:flex;gap:8px}
.braun .stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:26px;border-top:1px solid #CFCBC3;border-bottom:1px solid #CFCBC3}
.braun .stats>div{padding:12px 0 12px 16px;border-left:1px solid #CFCBC3}
.braun .stats>div:first-child{border-left:0;padding-left:0}
.braun .v{font-size:20px;margin-top:6px}
.braun .prog{margin-top:22px}
.braun .pl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.braun .track{height:4px;background:#D2CEC6}
.braun .track i{display:block;height:100%;background:#E0601E}
.braun .lr{display:grid;grid-template-columns:48px 22px 120px 1fr 80px 70px;align-items:center;height:33px;border-top:1px solid #D9D6CF;font-size:12px}
.braun .lr .t,.braun .lr .fo{color:#7A766E}
.braun .lr .sz{text-align:right;color:#7A766E}
.braun .sb{height:30px;flex:none;border-top:1px solid #CFCBC3;display:flex;gap:28px;align-items:center;padding:0 20px;font-size:11px;color:#7A766E}
.braun .sb span:first-child{margin-right:auto}
.braun-dlg{width:400px;background:#F2F1ED;border:1px solid #B5B1A8;padding:24px 26px;color:#1A1A1A}
.braun-dlg .code{display:flex;gap:8px;margin:20px 0 24px}
.braun-dlg .code span{width:44px;height:56px;border:1px solid #CFCBC3;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
.braun-dlg .code span.gap{width:10px;border:0;background:none}

/* B. Windows 2000 */
.w2k{background:#D4D0C8;color:#000;font-size:12px;display:flex;flex-direction:column;padding:3px;border:1px solid;border-color:#D4D0C8 #404040 #404040 #D4D0C8;box-shadow:inset 1px 1px #fff,inset -1px -1px #808080}
.w2k .r{border:1px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080}
.w2k .k{border:1px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #404040}
.w2k .tt{height:20px;background:#0A246A;color:#fff;font-weight:bold;display:flex;align-items:center;gap:5px;padding:0 3px 0 4px;flex:none}
.w2k .tbtns{margin-left:auto;display:flex}
.w2k .tbn{width:16px;height:14px;background:#D4D0C8;display:flex;align-items:center;justify-content:center}
.w2k .menu{display:flex;height:21px;align-items:center;flex:none}
.w2k .menu span{padding:0 7px}
.w2k .tool{display:flex;align-items:center;gap:2px;height:32px;padding:0 3px;border-top:1px solid #808080;border-bottom:1px solid #fff;box-shadow:0 1px #808080,inset 0 1px #fff;flex:none}
.w2k .tbb{display:flex;align-items:center;gap:5px;padding:3px 7px;height:24px}
.w2k .tbb.hov{border:1px solid;border-color:#fff #808080 #808080 #fff}
.w2k .sep{width:2px;height:20px;border-left:1px solid #808080;border-right:1px solid #fff;margin:0 4px}
.w2k .tabs{display:flex;padding:6px 6px 0;flex:none}
.w2k .tab{padding:3px 12px 4px;border:1px solid;border-color:#fff #404040 transparent #fff;border-bottom:0;margin-right:-2px;position:relative;top:2px;background:#D4D0C8}
.w2k .tab.on{top:0;padding-bottom:6px;z-index:1;margin:0 -2px 0 -2px}
.w2k .tabbody{flex:1;margin:0 6px 6px;border:1px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.w2k .lv{background:#fff;flex:1;overflow:hidden}
.w2k .lvh,.w2k .lvr{display:grid;grid-template-columns:120px 190px 100px 150px 110px 1fr}
.w2k .lvh>span{background:#D4D0C8;height:19px;display:flex;align-items:center;padding:0 6px;border:1px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080}
.w2k .lvr{height:19px;align-items:center}
.w2k .lvr>span{padding:0 6px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.w2k .lvr.sel>span{background:#0A246A;color:#fff}
.w2k .cp{height:13px;width:96px;background:#fff;padding:1px}
.w2k .cp i{display:block;height:100%;background:repeating-linear-gradient(90deg,#0A246A 0 7px,transparent 7px 9px)}
.w2k .lvr.sel .cp{outline:1px solid #fff}
.w2k fieldset{border:1px solid #808080;box-shadow:1px 1px #fff,inset 1px 1px #fff;padding:6px 12px 12px;flex:none}
.w2k legend{padding:0 3px}
.w2k .kv{display:grid;grid-template-columns:110px 1fr 110px 1fr;row-gap:6px;margin-top:4px}
.w2k .bigp{height:18px;background:#fff;padding:2px;margin-top:10px}
.w2k .bigp i{display:block;height:100%;width:35%;background:repeating-linear-gradient(90deg,#0A246A 0 9px,transparent 9px 11px)}
.w2k .pb{min-width:75px;height:23px;background:#D4D0C8;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.w2k .sbar{display:flex;gap:2px;height:20px;margin-top:1px;flex:none}
.w2k .sbar span{display:flex;align-items:center;padding:0 6px;border:1px solid;border-color:#808080 #fff #fff #808080}
.w2k-dlg{width:380px;height:auto}

/* C. Swiss */
.swiss{background:#fff;color:#000;padding:26px 36px 22px;display:flex;flex-direction:column}
.swiss .wc{position:absolute;right:14px;top:12px;display:flex;gap:12px}
.swiss .head{display:grid;grid-template-columns:1fr 190px 190px;align-items:end;padding-bottom:14px}
.swiss h1{font-size:60px;line-height:.86;letter-spacing:-2.5px;font-weight:bold}
.swiss .meta{font-size:12px;line-height:1.45}
.swiss .meta b{display:block;font-size:13px}
.swiss .rule{height:6px;background:#000;flex:none}
.swiss .row{display:grid;grid-template-columns:52px 1fr 190px 110px;padding:13px 0 12px;border-bottom:1px solid #000;align-items:baseline;position:relative}
.swiss .row:last-of-type{border-bottom:0}
.swiss .num{font-size:13px;font-weight:bold}
.swiss .nm{font-size:25px;font-weight:bold;letter-spacing:-.6px}
.swiss .pt{font-size:12px;margin-top:3px;font-weight:normal;letter-spacing:0}
.swiss .st{font-size:13px}
.swiss .big{font-size:34px;font-weight:bold;text-align:right;letter-spacing:-1.5px}
.swiss .red{color:#E30613}
.swiss .bar{position:absolute;left:52px;bottom:-1px;height:4px;background:#E30613}
.swiss .bottom{display:grid;grid-template-columns:52px 1fr 300px;padding-top:16px;flex:1;min-height:0}
.swiss .h{font-size:13px;font-weight:bold;margin-bottom:8px}
.swiss .li{display:grid;grid-template-columns:52px 110px 1fr 70px;font-size:12px;line-height:22px}
.swiss .li .g{color:#777}
.swiss .act{border-top:1px solid #000;display:flex;align-items:center;justify-content:space-between;height:40px;font-size:15px;font-weight:bold}
.swiss .act.pri{background:#E30613;color:#fff;border-top:0;padding:0 12px;margin-top:6px}
.swiss-dlg{width:420px;background:#fff;border:2px solid #000;padding:24px 26px 22px}
.swiss-dlg .c{font-size:64px;font-weight:bold;letter-spacing:-2px;color:#E30613;margin:16px 0 10px;line-height:1}

/* D. Rack */
.rack{background:#1D1D1D;color:#CFCFCF;border:1px solid #000;padding:20px 30px;display:flex;flex-direction:column;gap:14px}
.rack .screw{position:absolute;width:13px;height:13px;border-radius:50%;background:#383838;border:1px solid #0C0C0C}
.rack .screw:after{content:'';position:absolute;left:2px;right:2px;top:5px;height:1.5px;background:#121212;transform:rotate(35deg)}
.rack .top{display:flex;align-items:flex-end;padding:0 4px}
.rack .brand{font-size:20px;font-weight:bold;letter-spacing:6px;color:#E6E6E6}
.rack .model{font-size:9px;letter-spacing:2px;color:#7D7D7D;margin:0 0 4px 16px}
.rack .leds{margin-left:auto;display:flex;gap:18px}
.rack .ledw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:8px;letter-spacing:1.5px;color:#8A8A8A}
.rack .led{width:8px;height:8px;border-radius:50%;background:#2C2C2C;border:1px solid #0A0A0A}
.rack .lab{font-size:9px;letter-spacing:2px;color:#7D7D7D;margin-bottom:5px}
.rack .lcd{background:#191100;border:2px solid #0B0B0B;box-shadow:inset 0 0 0 1px #2E2200;color:#FFB000;font-family:Consolas,'Courier New',monospace;font-size:13px;padding:8px 8px}
.rack .lr{display:grid;grid-template-columns:100px 1fr 130px 150px;height:23px;align-items:center;padding:0 8px;white-space:nowrap}
.rack .lr.hd{color:#6E4C00;font-size:11px;height:18px}
.rack .lr.sel{background:#FFB000;color:#191100}
.rack .seg{display:flex;gap:2px}
.rack .seg i{width:6px;height:11px;background:#3A2A00}
.rack .seg i.on{background:#FFB000}
.rack .lr.sel .seg i{background:#B07A00}
.rack .lr.sel .seg i.on{background:#191100}
.rack .mid{display:grid;grid-template-columns:1fr 330px;gap:22px}
.rack .meter{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:2px;color:#8A8A8A;height:22px}
.rack .meter .m{display:flex;gap:2px}
.rack .meter .m i{width:8px;height:10px;background:#2B2B2B}
.rack .log{font-size:12px;color:#C98B00;line-height:19px}
.rack .log .l{display:grid;grid-template-columns:60px 130px 1fr 90px 80px;padding:0 8px}
.rack .keys{display:flex;gap:10px;align-items:flex-end}
.rack .keyw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:8px;letter-spacing:1.5px;color:#8A8A8A}
.rack .key{width:78px;height:34px;background:#2F2F2F;border:1px solid #0C0C0C;box-shadow:inset 0 1px 0 #474747,0 2px 0 #0A0A0A;display:flex;align-items:center;justify-content:center;gap:7px;color:#E2E2E2;font-size:10px;letter-spacing:1.5px}
.rack .key .kl{width:6px;height:6px;border-radius:50%;background:#3A2A00}
.rack .engr{margin-left:auto;font-size:9px;letter-spacing:2px;color:#6A6A6A;text-align:right;line-height:1.6}
.rack-dlg{width:420px;height:auto;padding:22px 26px}

/* E. Windows XP, layout A */
.xp{--f:Tahoma,Arial,sans-serif;font-family:var(--f);font-size:11px;color:#000;background:#ECE9D8;border-radius:8px 8px 0 0;padding:0 3px 3px;display:flex;flex-direction:column;
  box-shadow:inset -1px -1px #00138C,inset 1px 1px #0831D9,inset -2px -2px #001EA0,inset 2px 2px #166AEE,inset -3px -3px #003BDA,inset 3px 3px #0855DD}
.xp.arial{--f:Arial,sans-serif}
.xp .tt{height:30px;margin:0 -3px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;flex:none;
  background:linear-gradient(180deg,#0997FF,#0053EE 8%,#0050EE 40%,#06F 88%,#06F 93%,#005BFF 95%,#003DD7 96%,#003DD7)}
.xp .tt .tx{color:#fff;font:bold 13px 'Trebuchet MS',Arial,sans-serif;text-shadow:1px 1px #0F1089}
.xp.arial .tt .tx{font-family:Arial}
.xp .tbs{margin-left:auto;display:flex;gap:2px}
.xp .tbtn{width:21px;height:21px;border:1px solid #fff;border-radius:3px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 90% 90%,#0054E9 0%,#2263D5 55%,#4479E4 70%,#A3BBEC 90%,#fff 100%)}
.xp .tbtn.x{background:radial-gradient(circle at 90% 90%,#CC4600 0%,#DC6527 55%,#CD7546 70%,#FFCCB2 90%,#fff 100%)}
.xp .main{flex:1;display:grid;grid-template-columns:236px 1fr;min-height:0}
.xp .tp{background:linear-gradient(180deg,#7BA2E7,#6375D6);padding:12px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.xp .gh{height:25px;border-radius:5px 5px 0 0;background:linear-gradient(90deg,#fff 0%,#C6D3F7 100%);display:flex;align-items:center;padding:0 4px 0 11px;font-weight:bold;color:#215DC6}
.xp .sp .gh{background:linear-gradient(90deg,#0055E5,#2663E0);color:#fff}
.xp .chev{margin-left:auto;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#fff 30%,#C2CFF3);border:1px solid #B0C1EF;display:flex;align-items:center;justify-content:center}
.xp .gb{background:#D6DFF7;border:1px solid #fff;border-top:0;padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.xp .sp .gb{background:#EFF3FF}
.xp .it{display:flex;align-items:center;gap:6px;color:#215DC6;padding:2px 4px;margin:0 -4px;border-radius:2px}
.xp .it.sel{background:#316AC5;color:#fff}
.xp .it .r{margin-left:auto}
.xp .it .sub{display:block;color:#5A6E9A;font-size:10px;margin-top:1px}
.xp .det{background:#fff;padding:16px 20px 14px;display:flex;flex-direction:column;gap:14px;min-width:0;border-left:1px solid #9DB3E4}
.xp .dh{display:flex;align-items:center;gap:12px}
.xp .ttl{font:bold 20px 'Trebuchet MS',Arial,sans-serif;color:#0B2A7A}
.xp.arial .ttl{font-family:Arial}
.xp .b{font:11px var(--f);min-width:75px;height:23px;padding:0 10px;border:1px solid #003C74;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#000;
  background:linear-gradient(180deg,#fff,#ECEBE6 86%,#D6D0C5)}
.xp .b.def{box-shadow:inset -1px 1px #CEE7FF,inset 1px 2px #98B8EA,inset -2px 2px #BCD4F6,inset 1px -1px #89ADE4,inset 2px -2px #89ADE4}
.xp .b.hov{box-shadow:inset -1px 1px #FFF0CF,inset 1px 2px #FDD889,inset -2px 2px #FBC761,inset 2px -2px #E5A01A}
.xp fieldset{border:1px solid #D0D0BF;border-radius:4px;padding:6px 12px 12px}
.xp legend{color:#0046D5;padding:0 3px}
.xp .kv{display:grid;grid-template-columns:80px 1fr 80px 1fr;row-gap:5px;margin:4px 0 10px}
.xp .kv .k{color:#555}
.xp .pg{height:17px;border:1px solid #686868;border-radius:3px;padding:2px 3px;background:#fff;box-shadow:inset 0 0 0 1px #D8D8D8}
.xp .pg i{display:block;height:100%;background:repeating-linear-gradient(to right,#fff 0 2px,transparent 2px 10px),linear-gradient(to bottom,#ACEDAD 0%,#7BE47D 14%,#4CDA50 28%,#2ED330 42%,#42D845 57%,#76E275 71%,#8FE791 85%,#fff 100%)}
.xp .lv{border:1px solid #7F9DB9;flex:1;min-height:0;overflow:hidden}
.xp .lh,.xp .lr{display:grid;grid-template-columns:52px 104px 1fr 90px 72px}
.xp .lh>span{height:21px;display:flex;align-items:center;padding:0 6px;border-right:1px solid #C7C5B2;background:linear-gradient(180deg,#fff 0%,#F3F2EB 75%,#E3E1D6 100%);border-bottom:2px solid #D5D2CA}
.xp .lr>span{height:20px;display:flex;align-items:center;gap:5px;padding:0 6px;white-space:nowrap;overflow:hidden}
.xp .lr .g{color:#666}
.xp .sb{height:22px;display:flex;align-items:center;flex:none;border-top:1px solid #fff;box-shadow:0 -1px #D6D2C2}
.xp .sb span{padding:0 10px;border-left:1px solid #C2BFA5;height:16px;display:flex;align-items:center}
.xp .sb span:first-child{border-left:0;margin-right:auto}
.xp-dlg{width:390px;height:auto}
.xp-dlg .code{border:1px solid #7F9DB9;background:#fff;font:bold 26px var(--f);letter-spacing:6px;text-align:center;padding:6px 0;margin-top:10px}
.fontsw{display:flex;gap:6px;align-items:center;font-size:12px}
.fontsw button{font:12px Arial;padding:4px 10px;border:1px solid #111;background:#fff;cursor:pointer}
.fontsw button.on{background:#111;color:#fff}
</style>
</head>
<body>
<div class="switch" id="sw">
  <button data-v="a" class="on">A. Braun / Dieter Rams</button>
  <button data-v="b">B. Classic Windows 2000</button>
  <button data-v="c">C. Swiss / International</button>
  <button data-v="d">D. Rack / hardware panel</button>
  <button data-v="e">E. Windows XP, layout A</button>
</div>
<div id="out"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="xFoldBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D37C"/><stop offset="1" stop-color="#D49B2E"/></linearGradient>
    <linearGradient id="xFoldFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1BE"/><stop offset=".45" stop-color="#F9D777"/><stop offset="1" stop-color="#E7AF3F"/></linearGradient>
    <radialGradient id="xShadow"><stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="xGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="xOrbG" cx=".5" cy=".65" r=".62"><stop offset="0" stop-color="#9BEA66"/><stop offset=".7" stop-color="#3FA827"/><stop offset="1" stop-color="#23781A"/></radialGradient>
    <radialGradient id="xOrbB" cx=".5" cy=".65" r=".62"><stop offset="0" stop-color="#86BCFF"/><stop offset=".7" stop-color="#2F6FE0"/><stop offset="1" stop-color="#1745B0"/></radialGradient>
    <linearGradient id="xTri" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF2A8"/><stop offset=".5" stop-color="#FFD22E"/><stop offset="1" stop-color="#E9A500"/></linearGradient>
    <linearGradient id="xScr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AD6FF"/><stop offset=".55" stop-color="#3478DC"/><stop offset="1" stop-color="#173F9E"/></linearGradient>
    <linearGradient id="xBezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F7F3"/><stop offset="1" stop-color="#BFC4CC"/></linearGradient>
    <linearGradient id="xArrG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A6EC86"/><stop offset=".5" stop-color="#4DBB2C"/><stop offset="1" stop-color="#2C8A1A"/></linearGradient>
    <linearGradient id="xArrB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A8CCFF"/><stop offset=".5" stop-color="#3C7BE6"/><stop offset="1" stop-color="#1C4DB8"/></linearGradient>

function gearPath(cx, cy, ro, ri, n) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n, s = Math.PI / n;
    [[ri, a - s * .6], [ro, a - s * .34], [ro, a + s * .34], [ri, a + s * .6]].forEach(([r, t], j) =>
      d += (i === 0 && j === 0 ? 'M' : 'L') + (cx + r * Math.cos(t)).toFixed(2) + ' ' + (cy + r * Math.sin(t)).toFixed(2));
  }
  return d + 'Z';
}

    <path d="M8.5 6H17L9.5 17H8.5Z" fill="#fff" opacity=".28"/>
    <path d="M4.5 20H27.5L30.6 25.6Q31.2 27 29.6 27H2.4Q0.8 27 1.4 25.6Z" fill="url(#xBezel)" stroke="#5D6672" stroke-width="1.2"/>
    <path d="M6.5 22.2H25.5M5.8 24.3H26.2" stroke="#9AA3B0"/>`,
  monitor: MON,
  ok: orb('xOrbG', '#23701A', embossed('M9.6 17l4.6 4.6 8.6-9.8', '#1E5A12')),
  add: orb('xOrbG', '#23701A', embossed('M16 9.5v14M9 16.5h14', '#1E5A12')),
  sync: orb('xOrbB', '#163F9E', `
    <path d="M22.6 14.1A7 7 0 0 0 9.4 14.1M9.4 18.9A7 7 0 0 0 22.6 18.9" stroke="#fff" stroke-width="2.6" fill="none"/>
    <path d="M6 13.2H12.8L9.4 17.8ZM19.2 19.8H26L22.6 15.2Z" fill="#fff"/>`),
  warn: `${shadow(29.2, 13)}
    <path d="M16 3Q17.3 3 18 4.3L29.8 25.8Q30.5 27.6 28.6 27.6H3.4Q1.5 27.6 2.2 25.8L14 4.3Q14.7 3 16 3Z" fill="url(#xTri)" stroke="#A97500" stroke-width="1.2"/>
    <path d="M16 6L25.5 23.5H6.5Z" fill="url(#xGloss)" opacity=".45"/>
    <rect x="14.3" y="10" width="3.4" height="10.5" rx="1.7" fill="#262626"/>
    <circle cx="16" cy="23.6" r="1.9" fill="#262626"/>`,
  down: `${shadow(29.3, 9)}
    <path d="M12 3.5H20Q21 3.5 21 4.5V14.5H25.6Q27.3 14.5 26.2 15.8L16.9 26.6Q16 27.6 15.1 26.6L5.8 15.8Q4.7 14.5 6.4 14.5H11V4.5Q11 3.5 12 3.5Z" fill="url(#xArrG)" stroke="#2A7316" stroke-width="1.2"/>
    <path d="M12.7 5V15.6" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>`,
  up: `${shadow(29.6, 7)}
    <path d="M12 28.5H20Q21 28.5 21 27.5V17.5H25.6Q27.3 17.5 26.2 16.2L16.9 5.4Q16 4.4 15.1 5.4L5.8 16.2Q4.7 17.5 6.4 17.5H11V27.5Q11 28.5 12 28.5Z" fill="url(#xArrB)" stroke="#1A47A8" stroke-width="1.2"/>
    <path d="M12.7 27V16.4" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>`,
  pair: `<g transform="scale(.62)">${MON}</g><g transform="translate(12 11) scale(.62)">${MON}</g>
    <path d="M9.9 17.4V23.2H13.4" stroke="#2F6FE0" stroke-width="1.6" fill="none"/>`,

    <rect x="7" y="4" width="7" height="23" rx="1.8" fill="url(#xArrB)" stroke="#1A47A8" stroke-width="1.2"/>

    <path d="M7 9H25L23.3 27.6Q23.2 28.8 22 28.8H10Q8.8 28.8 8.7 27.6Z" fill="url(#xBin)" stroke="#53698A" stroke-width="1.2"/>

const xi = (n, s = 16) => X16[n]
  ? `<svg width="${s}" height="${s}" viewBox="0 0 16 16">${X16[n]}</svg>`
  : `<svg width="${s}" height="${s}" viewBox="0 0 32 32">${XI[n]}</svg>`;
let xpFont = 'tahoma';

function xpWin(title, body, small) {
  const btns = small ? `<span class="tbtn x">${xi('tclose', 15)}</span>`
    : `<span class="tbtn">${xi('tmin', 15)}</span><span class="tbtn">${xi('tmax', 15)}</span><span class="tbtn x" style="margin-left:2px">${xi('tclose', 15)}</span>`;
  return `<div class="tt">${small ? '' : xi('sync', 16)}<span class="tx">${title}</span><div class="tbs">${btns}</div></div>${body}`;
}

function xp() {
  const stIc = { ok: 'ok', sync: 'sync', conf: 'warn' };
  const group = (title, body, special) => `<div class="g ${special ? 'sp' : ''}"><div class="gh">${title}<span class="chev">${xi('chev', 14)}</span></div><div class="gb">${body}</div></div>`;
  const folders = D.folders.map((f, i) => `<div class="it ${i === 1 ? 'sel' : ''}">${xi('folder')}<span>${f.name}</span><span class="r">${xi(stIc[f.state], 14)}</span></div>`).join('');
  const devices = `
    <div class="it" style="align-items:flex-start">${xi('laptop')}<span>${D.peer.name}<span class="sub">Online, ${D.peer.ip}</span></span></div>
    <div class="it" style="align-items:flex-start">${xi('monitor')}<span>${D.nearby.name}<span class="sub">Nearby, not paired</span></span></div>`;
  const tasks = `
    <div class="it">${xi('add')}<span>Add a folder</span></div>
    <div class="it">${xi('pair')}<span>Pair a device</span></div>
    <div class="it">${xi('sync')}<span>Sync all now</span></div>
    <div class="it">${xi('gear')}<span>Settings</span></div>`;
  const log = D.log.map(l => `<div class="lr"><span class="g">${l.t}</span><span>${xi(l.k, 14)}${l.a}</span><span>${l.f}</span><span class="g">${l.fo}</span><span class="g" style="justify-content:flex-end">${l.s}</span></div>`).join('');
  const cls = `xp ${xpFont === 'arial' ? 'arial' : ''}`;
  const main = `
    <div class="main">
      <div class="tp">
        ${group('Folders', folders, true)}
        ${group('Devices', devices)}
        ${group('Tasks', tasks)}
      </div>
      <div class="det">
        <div class="dh">${xi('folder', 48)}
          <div><div class="ttl">${sel.name}</div><div style="color:#555;margin-top:2px">${sel.path}</div></div>
          <div style="margin-left:auto;display:flex;gap:6px"><span class="b hov">${xi('pause', 14)}Pause</span><span class="b">Open folder</span></div></div>
        <fieldset><legend>Status</legend>
          <div class="kv"><span class="k">Files:</span><span>40</span><span class="k">Remaining:</span><span>412 MB</span>
            <span class="k">Size:</span><span>1.1 GB</span><span class="k">Speed:</span><span>8.4 MB/s</span></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>Syncing 12 of 40 files with ${D.peer.name}</span><span>35%</span></div>
          <div class="pg"><i style="width:35%"></i></div>
        </fieldset>
        <div style="font-weight:bold;color:#0B2A7A">Activity</div>
        <div class="lv">
          <div class="lh"><span>Time</span><span>Action</span><span>File</span><span>Folder</span><span>Size</span></div>${log}</div>
      </div>
    </div>
    <div class="sb"><span>Listening on port ${D.me.port}</span><span>Down: 8.4 MB/s</span><span>Up: 0 KB/s</span><span>${D.me.name}</span></div>`;
  const dlg = `
    <div style="padding:14px 14px 4px;display:flex;gap:14px">${xi('pair', 32)}
      <div style="flex:1"><div>Pairing with <b>${D.nearby.name}</b> (${D.nearby.ip}).</div>
        <div style="margin-top:6px">Make sure the other computer shows the same code:</div>
        <div class="code">482 913</div></div></div>
    <div style="display:flex;justify-content:flex-end;gap:6px;padding:12px">
      <span class="b def">Pair</span><span class="b">Cancel</span></div>`;
  return `
  <div class="fontsw">Font:<button data-font="tahoma" class="${xpFont === 'tahoma' ? 'on' : ''}">Tahoma (as in XP)</button><button data-font="arial" class="${xpFont === 'arial' ? 'on' : ''}">Arial</button></div>
  <div class="win ${cls}">${xpWin('Tandem', main)}</div>
  <div class="win ${cls} xp-dlg">${xpWin('Pair device', dlg, true)}</div>
  <div class="note" style="background:#ECE9D8;display:flex;gap:22px;flex-wrap:wrap">
    ${Object.keys(XI).map(n => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="display:flex;align-items:flex-end;gap:8px">${xi(n, 16)}${xi(n, 32)}${xi(n, 48)}</div><span>${n}</span></div>`).join('')}
  </div>
  <div class="note">Luna blue title bar and beige #ECE9D8 body, Explorer-style blue task pane on the left with collapsible groups (folders, devices, tasks), folder details on the right: status group box with the green XP progress bar and a Details-view list of recent activity.</div>`;
}

const R = { a: braun, b: w2k, c: swiss, d: rack, e: xp };
let cur = 'e';
function show(v) {
  cur = v;
  document.querySelectorAll('#sw button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.getElementById('out').innerHTML = `<div class="stage">${R[v]()}</div>`;
}
document.getElementById('sw').addEventListener('click', e => { if (e.target.dataset.v) show(e.target.dataset.v); });
document.getElementById('out').addEventListener('click', e => { if (e.target.dataset.font) { xpFont = e.target.dataset.font; show(cur); } });
addEventListener('keydown', e => { const v = { 1: 'a', 2: 'b', 3: 'c', 4: 'd', 5: 'e' }[e.key]; if (v) show(v); });
show('e');
</script>
</body>
</html>
